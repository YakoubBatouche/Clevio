name: Prepare Clevio toolchain

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize and install the website and animation tools
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if (!fs.existsSync('package.json')) {
            fs.writeFileSync('package.json', JSON.stringify({
              name: 'clevio', version: '0.1.0', private: true, type: 'module',
              engines: { node: '>=24' },
              scripts: { dev: 'vite --host 0.0.0.0', build: 'tsc -b && vite build', preview: 'vite preview --host 0.0.0.0', lint: 'eslint .', typecheck: 'tsc -b', 'test:e2e': 'playwright test' }
            }, null, 2) + '\n');
          }
          NODE
          npm install --save-exact react@19 react-dom@19 motion gsap @gsap/react lenis three @react-three/fiber@9 @react-three/drei@10 lucide-react @fontsource-variable/alexandria @fontsource-variable/cairo
          npm install --save-dev --save-exact vite @vitejs/plugin-react typescript @types/react@19 @types/react-dom@19 @types/three @types/node@24 eslint @eslint/js typescript-eslint eslint-plugin-react-hooks eslint-plugin-react-refresh globals @playwright/test @axe-core/playwright sharp
          npm ls --depth=0
      - name: Save the installed, reproducible dependency versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Install React, Vite, TypeScript and animation toolchain"
            git push
          fi
