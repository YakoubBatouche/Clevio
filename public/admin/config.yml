# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.260.0/schema/sveltia-cms.json
backend:
  name: github
  repo: YakoubBatouche/Clevio
  branch: main
  auth_methods: [token]

app_title: لوحة محتوى Clevio
logo:
  src: /favicon.svg
  show_in_header: true
site_url: https://clevio-two.vercel.app
display_url: https://clevio-two.vercel.app
media_folder: public/uploads
public_folder: /uploads
media_libraries:
  all:
    max_file_size: 5242880
    filename_template: "{{year}}{{month}}{{day}}-{{uuid_short}}"
editor:
  preview: false

collections:
  - name: homepage
    label: الصفحة الرئيسية
    icon: home
    description: عدّل العنوان الرئيسي، ونبذة الشركة، ومعلومات التواصل، وشعارات الشركاء.
    files:
      - name: site
        label: تعديل محتوى الصفحة الرئيسية
        file: src/content/site.json
        fields:
          - name: hero
            label: مقدمة الصفحة الرئيسية
            widget: object
            collapsed: false
            fields:
              - { name: lead, label: بداية العنوان الرئيسي, widget: string }
              - { name: focus, label: الجزء الملوّن من العنوان, widget: string, hint: 'يفضّل أن يكون قصيرًا ليظهر بوضوح على الهاتف.' }
              - { name: descriptionLead, label: بداية النص أسفل العنوان, widget: string }
              - { name: descriptionTail, label: تكملة النص أسفل العنوان, widget: string }
              - { name: primaryAction, label: نص زر بدء المشروع, widget: string }
              - { name: secondaryAction, label: نص زر اكتشاف الخدمات, widget: string }
          - name: about
            label: نبذة عن الشركة
            widget: object
            collapsed: true
            fields:
              - { name: copy, label: نبذة عن Clevio, widget: text }
              - { name: action, label: نص زر التواصل, widget: string }
          - name: partners
            label: الشركاء وشعاراتهم
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: عنوان القسم, widget: string }
              - { name: note, label: ملاحظة أسفل الشعارات, widget: string, required: false }
              - name: logos
                label: شعارات الشركاء
                label_singular: شعار شريك
                hint: أضف اسم الشريك وصورة شعاره لعرضه على الموقع.
                widget: list
                required: false
                collapsed: auto
                summary: "{{name}}"
                thumbnail: image
                fields:
                  - { name: name, label: اسم الشريك, widget: string }
                  - { name: image, label: شعار الشريك, widget: image, choose_url: false }
          - name: contact
            label: معلومات التواصل ونموذج المشروع
            widget: object
            collapsed: true
            fields:
              - { name: email, label: بريد استقبال رسائل المشاريع, widget: string, required: false }
              - { name: whatsapp, label: رقم واتساب للتواصل, widget: string, required: false, hint: 'أدخل رقم الهاتف مع رمز البلد.' }
              - { name: eyebrow, label: النص فوق العنوان, widget: string }
              - { name: heading, label: عنوان القسم, widget: string }
              - { name: intro, label: الوصف, widget: text }
              - { name: whatsappMessage, label: رسالة واتساب المبدئية, widget: text }
              - { name: art, label: الصورة بجانب النموذج, widget: image, choose_url: false }
              - name: form
                label: نصوص حقول النموذج وأزراره
                widget: object
                collapsed: true
                fields:
                  - { name: label, label: الاسم الوصفي للنموذج, widget: string }
                  - { name: nameLabel, label: حقل الاسم, widget: string }
                  - { name: namePlaceholder, label: مثال الاسم, widget: string }
                  - { name: contactLabel, label: حقل بيانات التواصل, widget: string }
                  - { name: contactPlaceholder, label: مثال بيانات التواصل, widget: string }
                  - { name: serviceLabel, label: حقل اختيار الخدمة, widget: string }
                  - { name: servicePlaceholder, label: دعوة لاختيار الخدمة, widget: string }
                  - { name: completeProject, label: خيار مشروع متكامل, widget: string }
                  - { name: briefLabel, label: حقل تفاصيل المشروع, widget: string }
                  - { name: briefPlaceholder, label: مثال تفاصيل المشروع, widget: text }
                  - { name: submit, label: زر تجهيز المشروع, widget: string }
                  - { name: required, label: ملاحظة الحقول المطلوبة, widget: string }
                  - { name: viaEmail, label: رابط التواصل بالبريد, widget: string }
                  - { name: viaWhatsapp, label: رابط التواصل بواتساب, widget: string }
                  - { name: draftMessage, label: رسالة تجهيز المسودة, widget: text }
                  - { name: openEmail, label: زر فتح البريد, widget: string }
                  - { name: validationMessage, label: رسالة بيانات تواصل غير صالحة, widget: string }
                  - { name: subject, label: عنوان رسالة المشروع, widget: string }
          - name: brand
            label: اسم الموقع وشعاره
            widget: object
            collapsed: true
            fields:
              - { name: name, label: اسم العلامة, widget: string }
              - { name: logo, label: شعار Clevio, widget: image, choose_url: false }
          - name: navigation
            label: روابط القائمة العلوية
            widget: object
            collapsed: true
            fields:
              - { name: home, label: الرئيسية, widget: string }
              - { name: services, label: الخدمات, widget: string }
              - { name: work, label: الأعمال, widget: string }
              - { name: contact, label: التواصل, widget: string }
              - { name: about, label: من نحن, widget: string }
          - name: footer
            label: أسفل الصفحة
            widget: object
            collapsed: true
            fields:
              - { name: linksHeading, label: عنوان الروابط السريعة, widget: string }
              - { name: contactCopy, label: نص التواصل, widget: string }
              - { name: contactAction, label: زر التواصل, widget: string }
              - { name: servicesHeading, label: عنوان الخدمات, widget: string }
              - name: serviceLinks
                label: أسماء روابط الخدمات
                widget: list
                allow_add: false
                allow_remove: false
                allow_duplicate: false
                allow_reorder: false
                field: { name: label, label: اسم الرابط, widget: string }
              - { name: brandCopy, label: وصف Clevio, widget: text }
              - { name: copyright, label: حقوق النشر, widget: string }
              - { name: tagline, label: العبارة الختامية, widget: string }
          - name: seo
            label: ظهور الموقع في البحث وعند مشاركة الرابط
            widget: object
            collapsed: true
            fields:
              - { name: title, label: عنوان الصفحة في المتصفح, widget: string }
              - { name: description, label: وصف الصفحة لمحركات البحث, widget: text }
              - { name: shareTitle, label: عنوان معاينة المشاركة, widget: string }
              - { name: shareDescription, label: وصف معاينة المشاركة, widget: text }

  - name: services
    label: الخدمات
    icon: design_services
    description: اختر بطاقة خدمة لتعديل اسمها وتفاصيلها أو تغيير ترتيب ظهورها.
    files:
      - name: catalog
        label: تعديل بطاقات الخدمات
        file: src/content/services.json
        fields:
          - name: items
            label: الخدمات المعروضة
            hint: افتح أي بطاقة لتعديلها، أو اسحبها لتغيير ترتيبها على الموقع.
            widget: list
            collapsed: true
            summary: "{{title}}"
            allow_add: false
            allow_remove: false
            allow_duplicate: false
            fields:
              - { name: id, widget: hidden }
              - { name: title, label: اسم الخدمة, widget: string }
              - name: offerings
                label: ما تشمل هذه الخدمة
                label_singular: تفصيل
                widget: list
                min: 1
                field: { name: offering, label: تفصيل الخدمة, widget: string }
          - { name: title, label: عنوان القسم, widget: string }
          - { name: eyebrow, label: النص الصغير فوق عنوان القسم, widget: string }
          - name: intro
            label: الوصف أسفل عنوان القسم
            widget: list
            min: 2
            max: 2
            field: { name: line, label: سطر الوصف, widget: string }
          - { name: exploreLabel, label: نص زر استكشاف الخدمة, widget: string }
          - { name: dialogEyebrow, label: النص فوق عنوان نافذة الخدمة, widget: string }
          - { name: dialogDescription, label: وصف نافذة الخدمة, widget: text }
          - { name: dialogActionLabel, label: زر التواصل في نافذة الخدمة, widget: string }
          - { name: closeLabel, label: اسم زر إغلاق النافذة, widget: string }

  - name: galleries
    label: معارض الأعمال
    icon: collections
    description: اختر معرضًا لإضافة أعمال جديدة، أو لتغيير الصور والعناوين وترتيبها.
    files:
      - name: print
        label: المطبوعات
        file: src/content/portfolio/print.json
        fields:
          - &category_id { name: id, widget: hidden }
          - name: items
            label: الأعمال والصور
            label_singular: عمل
            hint: &work_list_hint أضف عملًا ثم اختر صورته واكتب عنوانه. اسحب الأعمال لتغيير ترتيبها.
            widget: list
            required: false
            collapsed: auto
            summary: "{{title}}"
            thumbnail: image
            add_to_top: true
            fields:
              - &work_id { name: id, widget: uuid }
              - &work_image { name: image, label: صورة العمل, widget: image, choose_url: false, hint: 'اختر صورة موجودة أو ارفع صورة جديدة حتى 5 ميغابايت.' }
              - &work_title { name: title, label: عنوان العمل, widget: string }
              - &work_alt { name: alt, label: وصف قصير للصورة, widget: string, hint: 'صف ما يظهر في الصورة ليستفيد منه زوّار الموقع الذين يستخدمون قارئ الشاشة.' }
              - &work_position { name: position, widget: hidden, required: false }
              - name: filterId
                label: التصنيف داخل المعرض
                widget: relation
                collection: galleries
                file: print
                value_field: "{{filters.*.id}}"
                display_fields: ["{{filters.*.label}}"]
                search_fields: ["{{filters.*.label}}"]
                required: false
          - &category_title { name: title, label: اسم المعرض, widget: string }
          - &category_description { name: description, label: وصف المعرض, widget: text }
          - &category_cover { name: cover, label: صورة الغلاف, widget: image, choose_url: false, hint: 'تظهر هذه الصورة على بطاقة المعرض في الصفحة الرئيسية.' }
          - &category_filters
            name: filters
            label: أسماء التصنيفات وأوصافها
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{label}}"
            allow_add: false
            allow_remove: false
            allow_duplicate: false
            fields:
              - { name: id, widget: hidden }
              - { name: label, label: اسم التصنيف, widget: string }
              - { name: description, label: وصف التصنيف, widget: text }
      - name: logos
        label: الشعارات
        file: src/content/portfolio/logos.json
        fields:
          - *category_id
          - name: items
            label: الأعمال والصور
            label_singular: عمل
            hint: *work_list_hint
            widget: list
            required: false
            collapsed: auto
            summary: "{{title}}"
            thumbnail: image
            add_to_top: true
            fields:
              - *work_id
              - *work_image
              - *work_title
              - *work_alt
              - *work_position
          - *category_title
          - *category_description
          - *category_cover
          - { name: filters, widget: hidden, default: [] }
      - name: digital-marketing
        label: التسويق الرقمي والنمو
        file: src/content/portfolio/digital-marketing.json
        fields:
          - *category_id
          - name: items
            label: الأعمال والصور
            label_singular: عمل
            hint: *work_list_hint
            widget: list
            required: false
            collapsed: auto
            summary: "{{title}}"
            thumbnail: image
            add_to_top: true
            fields:
              - *work_id
              - *work_image
              - *work_title
              - *work_alt
              - *work_position
              - name: filterId
                label: التصنيف داخل المعرض
                widget: relation
                collection: galleries
                file: digital-marketing
                value_field: "{{filters.*.id}}"
                display_fields: ["{{filters.*.label}}"]
                search_fields: ["{{filters.*.label}}"]
                required: false
          - *category_title
          - *category_description
          - *category_cover
          - *category_filters
      - name: web-app
        label: المواقع والتطبيقات
        file: src/content/portfolio/web-app.json
        fields:
          - *category_id
          - name: items
            label: الأعمال والصور
            label_singular: عمل
            hint: *work_list_hint
            widget: list
            required: false
            collapsed: auto
            summary: "{{title}}"
            thumbnail: image
            add_to_top: true
            fields:
              - *work_id
              - *work_image
              - *work_title
              - *work_alt
              - *work_position
              - name: filterId
                label: التصنيف داخل المعرض
                widget: relation
                collection: galleries
                file: web-app
                value_field: "{{filters.*.id}}"
                display_fields: ["{{filters.*.label}}"]
                search_fields: ["{{filters.*.label}}"]
                required: false
          - *category_title
          - *category_description
          - *category_cover
          - *category_filters
      - name: audiovisual-media
        label: الإنتاج السمعي البصري والإعلام
        file: src/content/portfolio/audiovisual-media.json
        fields:
          - *category_id
          - name: items
            label: الأعمال والصور
            label_singular: عمل
            hint: *work_list_hint
            widget: list
            required: false
            collapsed: auto
            summary: "{{title}}"
            thumbnail: image
            add_to_top: true
            fields:
              - *work_id
              - *work_image
              - *work_title
              - *work_alt
              - *work_position
              - name: filterId
                label: التصنيف داخل المعرض
                widget: relation
                collection: galleries
                file: audiovisual-media
                value_field: "{{filters.*.id}}"
                display_fields: ["{{filters.*.label}}"]
                search_fields: ["{{filters.*.label}}"]
                required: false
          - *category_title
          - *category_description
          - *category_cover
          - *category_filters

  - name: work
    label: نصوص قسم الأعمال
    icon: tune
    description: عدّل النصوص المشتركة بين المعارض. لإضافة الصور، افتح معارض الأعمال.
    files:
      - name: presentation
        label: تعديل عناوين قسم الأعمال
        file: src/content/portfolio.json
        fields:
          - { name: title, label: عنوان القسم, widget: string }
          - { name: eyebrow, label: النص الصغير فوق عنوان القسم, widget: string }
          - name: intro
            label: الوصف أسفل عنوان القسم
            widget: list
            min: 2
            max: 2
            field: { name: line, label: سطر الوصف, widget: string }
          - { name: note, label: ملاحظة أسفل البطاقات, widget: string, required: false }
          - { name: sheetNote, label: ملاحظة داخل المعرض, widget: string, required: false }
          - { name: emptyMessage, label: الرسالة التي تظهر عندما يكون المعرض فارغًا, widget: string }
          - { name: allFilterLabel, label: نص زر عرض كل الأعمال, widget: string }
          - { name: closeLabel, label: اسم زر إغلاق المعرض, widget: string }
          - { name: gripLabel, label: اسم مقبض سحب المعرض, widget: string }
          - { name: filtersLabel, label: اسم أدوات التصفية لقارئ الشاشة, widget: string }
          - { name: galleryLabel, label: اسم المعرض لقارئ الشاشة, widget: string }
          - { name: previewLabel, label: اسم زر تكبير الصورة, widget: string }
          - { name: closeImageLabel, label: اسم زر إغلاق الصورة, widget: string }
